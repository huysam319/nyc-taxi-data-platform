name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install lint and test tools
        run: |
          python -m pip install --upgrade pip
          pip install black ruff pytest pyspark
          # Cài đặt thêm dependencies từ dự án nếu có
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check formatting
        run: |
          black --check $(git ls-files '*.py')

      - name: Run lint
        run: |
          ruff check $(git ls-files '*.py')

      - name: Run PyTest
        env:
          SPARK_LOCAL_IP: "127.0.0.1"
          PYTHONPATH: "."
        run: |
          pytest tests/ -v

      - run: echo "CI is working!"

  build_images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        service: [streamlit, airflow]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for ${{ matrix.service }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/nyc-taxi-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and Push ${{ matrix.service }} Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max