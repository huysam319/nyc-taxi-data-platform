services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    networks:
      - data-platform

  spark-master:
    image: bitnamilegacy/spark:3.5

    container_name: spark-master

    environment:
      SPARK_MODE: master

    ports:
      - "7077:7077"
      - "8080:8080"

    volumes:
      - ./spark:/opt/spark-apps
      - ./lakehouse:/lakehouse

    networks:
      - data-platform

  spark-worker:
    image: bitnamilegacy/spark:3.5

    container_name: spark-worker

    depends_on:
      - spark-master

    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077

    volumes:
      - ./spark:/opt/spark-apps
      - ./lakehouse:/lakehouse

    networks:
      - data-platform

  airflow:
    image: apache/airflow:2.10.0

    container_name: airflow

    depends_on:
      - postgres
      - spark-master

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW_UID: 50000

    ports:
      - "8081:8080"

    command: standalone

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./spark:/opt/spark-apps
      - ./lakehouse:/lakehouse

    networks:
      - data-platform

  streamlit:
    build:
      context: ./streamlit

    container_name: streamlit

    depends_on:
      - postgres

    ports:
      - "8501:8501"

    volumes:
      - ./streamlit:/app

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    command: >
      streamlit run app.py
      --server.address=0.0.0.0
      --server.port=8501

    networks:
      - data-platform

networks:
  data-platform:

volumes:
  postgres_data: